body{
    margin:0;

}

.header{
    height:60px;
    background:#d50000;
    display:flex;
    align-items:center;
    padding-left:20px;
    font-weight:bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:8px;

    height:calc(100vh - 60px);

    padding:8px;
}

.card{
    position:relative;
    overflow:hidden;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    background:rgba(0,0,0,0.75);

    padding:12px;

    font-size:22px;
    font-weight:bold;
    line-height:1.3;
}

</style>
</head>
