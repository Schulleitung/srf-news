<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRF Sport</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#111;
color:#fff;
height:100vh;
overflow:hidden;
}

.header{
background:#c00;
padding:20px 40px;
font-size:40px;
font-weight:bold;
display:flex;
justify-content:space-between;
}

.content{
display:flex;
height:calc(100vh - 80px);
}

.image{
width:60%;
background-size:cover;
background-position:center;
}

.text{
width:40%;
padding:40px;
display:flex;
flex-direction:column;
justify-content:center;
}

h1{
font-size:56px;
line-height:1.2;
}

p{
font-size:28px;
line-height:1.4;
}

.footer{
position:absolute;
bottom:0;
width:100%;
background:#000;
padding:12px;
font-size:22px;
overflow:hidden;
white-space:nowrap;
}

.ticker{
display:inline-block;
padding-left:100%;
animation:move 60s linear infinite;
}

@keyframes move{
from{transform:translateX(0);}
to{transform:translateX(-100%);}
}
</style>
</head>

<body>

<div class="header">
<div>SRF SPORT</div>
<div id="time"></div>
</div>

<div class="content">
<div class="image" id="image"></div>

<div class="text">
<h1 id="title">Lade Nachrichten...</h1>
<p id="text"></p>
</div>
</div>

<div class="footer">
<div class="ticker" id="ticker"></div>
</div>

<script>

const feedUrl=
"https://api.rss2json.com/v1/api.json?rss_url=https://www.srf.ch/sport/bnf/rss/718";

let items=[];
let current=0;

async function loadNews(){

const response=await fetch(feedUrl);
const data=await response.json();

items=data.items;

document.getElementById("ticker").innerHTML=
items.map(x=>"⚽ "+x.title).join(" ● ");

showNews();
}

function showNews(){

if(items.length===0)return;

const item=items[current];

document.getElementById("title").innerText=item.title;

document.getElementById("text").innerHTML=
item.description.replace(/<[^>]+>/g,'');

if(item.thumbnail){
document.getElementById("image").style.backgroundImage=
`url('${item.thumbnail}')`;
}

current++;

if(current>=items.length){
current=0;
}
}

function updateTime(){

document.getElementById("time").innerHTML=
new Date().toLocaleTimeString('de-CH',{
hour:'2-digit',
minute:'2-digit'
});
}

setInterval(showNews,15000);
setInterval(updateTime,1000);

loadNews();
updateTime();

</script>

</body>
</html>
