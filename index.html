<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRF Sport Newswall</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.header{
    height:60px;
    background:#d50000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 20px;
    font-weight:bold;
    font-size:18px;
}

#clock{
    font-size:18px;
}

.grid{
    height:calc(100vh - 100px);
    padding:6px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:6px;
}

.card{
    background:#1a1a1a;
    overflow:hidden;
    border-radius:4px;
    display:flex;
    flex-direction:column;
}

.image{
    flex:1;
    background-size:cover;
    background-position:center;
    background-color:#333;
}

.title{
    padding:10px;
    background:#111;
    font-weight:bold;
    line-height:1.3;
    font-size:1.1vw;

    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;

    min-height:70px;
}

.footer{
    height:40px;
    background:#000;
    overflow:hidden;
    white-space:nowrap;
    display:flex;
    align-items:center;
}

.ticker{
    display:inline-block;
    padding-left:100%;
    animation:ticker 80s linear infinite;
    font-size:18px;
}

@keyframes ticker{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>

    <div>SRF SPORT</div>
    <div id="clock"></div>
</div>
