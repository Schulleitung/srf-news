<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRF Sport News</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

.header{
    height:60px;
    background:#d50000;
    color:white;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:28px;
    font-weight:bold;
}

.grid{
    height:calc(100vh - 100px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:8px;
    padding:8px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:6px;
    background:#333;
}

.image{
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.overlay{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    background:rgba(0,0,0,0.75);
    color:white;
    padding:14px;
    font-weight:bold;
    font-size:1.1vw;
    line-height:1.3;
}

.footer{
    height:40px;
    background:black;
    overflow:hidden;
    display:flex;
    align-items:center;
}

.ticker{
    color:white;
    white-space:nowrap;
    font-size:18px;
    padding-left:100%;
    animation:ticker 200s linear infinite;
}

@keyframes ticker{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>

<body>

<div class="header">
    SRF SPORT
</div>

<div class="grid">

    <div class="card">
        <div class="image" id="img0"></div>
        <div class="overlay" id="title0">Lade News ...</div>
    </div>

    <div class="card">
        <div class="image" id="img1"></div>
        <div class="overlay" id="title1"></div>
    </div>

    <div class="card">
        <div class="image" id="img2"></div>
        <div class="overlay" id="title2"></div>
    </div>

    <div class="card">
        <div class="image" id="img3"></div>
        <div class="overlay" id="title3"></div>
    </div>

    <div class="card">
        <div class="image" id="img4"></div>
        <div class="overlay" id="title4"></div>
    </div>

    <div class="card">
        <div class="image" id="img5"></div>
        <div class="overlay" id="title5"></div>
    </div>

</div>

<div class="footer">
    <div class="ticker" id="ticker">
        Lade Schlagzeilen...
    </div>
</div>

<script>

let news = [];
let page = 0;

function extractImage(str){

    if(!str){
        return "";
    }

    const match =
        str.match(/https?:\/\/[^"]+\.(webp|jpg|jpeg|png)/i);

    if(match){
        return match[0];
    }

    return "";
}

async function loadNews(){

    try{

        const response =
            await fetch("./news.json?" + Date.now());

        news = await response.json();

        document.getElementById("ticker").innerHTML =
            news.map(x => x.title).join(" ● ");

        showPage();

    }
    catch(error){

        console.error(error);

        document.getElementById("title0").innerText =
            "Fehler beim Laden von news.json";

    }
}

function showPage(){

    if(news.length === 0){
        return;
    }

    let start = page * 6;

    if(start >= news.length){
        page = 0;
        start = 0;
    }

    const current =
        news.slice(start,start + 6);

    current.forEach((item,index)=>{

        const title =
            document.getElementById("title" + index);

        const img =
            document.getElementById("img" + index);

        if(title){
            title.innerText = item.title;
        }

        const imageUrl =
            extractImage(item.image);

        if(img){

            if(imageUrl){

                img.style.backgroundImage =
                    `url("${imageUrl}")`;

            }
            else{

                img.style.backgroundImage =
                    "linear-gradient(135deg,#444,#222)";

            }
        }

    });

    page++;

}

loadNews();

setInterval(loadNews, 15 * 60 * 1000);

setInterval(showPage, 30 * 1000);

</script>

</body>
</html>
