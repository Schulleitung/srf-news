<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRF Sport News</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

.header{
    height:60px;
    background:#d50000;
    color:white;
    font-size:28px;
    font-weight:bold;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.grid{
    height:calc(100vh - 100px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:8px;
    padding:8px;
}

.card{
    position:relative;
    background:#222;
    overflow:hidden;
    border-radius:6px;
}

.image{
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
}

.overlay{
    position:absolute;
    bottom:0;
    left:0;
    right:0;

    background:rgba(0,0,0,0.75);

    color:white;

    padding:12px;

    font-weight:bold;

    font-size:1.15vw;

    line-height:1.3;
}

.footer{
    height:40px;
    background:#000;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.ticker{
    color:white;
    white-space:nowrap;
    padding-left:100%;
    animation:ticker 60s linear infinite;
    font-size:18px;
}

@keyframes ticker{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>

<body>

<div class="header">
    SRF SPORT
</div>

<div class="grid">

    <div class="card">
        <div class="image" id="img0"></div>
        <div class="overlay" id="title0">Lade News ...</div>
    </div>

    <div class="card">
        <div class="image" id="img1"></div>
        <div class="overlay" id="title1"></div>
    </div>

    <div class="card">
        <div class="image" id="img2"></div>
        <div class="overlay" id="title2"></div>
    </div>

    <div class="card">
        <div class="image" id="img3"></div>
        <div class="overlay" id="title3"></div>
    </div>

    <div class="card">
        <div class="image" id="img4"></div>
        <div class="overlay" id="title4"></div>
    </div>

    <div class="card">
        <div class="image" id="img5"></div>
        <div class="overlay" id="title5"></div>
    </div>

</div>

<div class="footer">
    <div class="ticker" id="ticker"></div>
</div>

<script>

const FEED =
'https://api.rss2json.com/v1/api.json?rss_url=https://www.srf.ch/sport/bnf/rss/718';

let news = [];
let page = 0;

async function loadFeed(){

    try{

        const response = await fetch(FEED);
        const data = await response.json();

        news = data.items || [];

        updateView();

        document.getElementById("ticker").innerHTML =
            news.map(n => n.title).join(" ● ");

    }
    catch(error){

        document.getElementById("title0").innerText =
        "Feed aktuell nicht verfügbar";

        console.log(error);

    }

}

function updateView(){

    if(news.length === 0){
        return;
    }

    const start = page * 6;

    const current =
        news.slice(start,start+6);

    current.forEach((item,index)=>{

        document.getElementById("title"+index)
        .innerText = item.title;

        const image =
            item.thumbnail ||
            "";

        document.getElementById("img"+index)
        .style.backgroundImage =
            `url('${image}')`;

    });

    page++;

    if(page * 6 >= news.length){
        page = 0;
    }

}

loadFeed();

setInterval(loadFeed,300000);
setInterval(updateView,30000);

</script>

</body>
</html>
