<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRF Sport News</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

.header{
    height:60px;
    background:#d50000;
    color:white;
    font-size:28px;
    font-weight:bold;
    display:flex;
    align-items:center;
    padding:0 20px;
}

.grid{
    height:calc(100vh - 100px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:8px;
    padding:8px;
}

.card{
    position:relative;
    background:#222;
    overflow:hidden;
    border-radius:6px;
}

.image{
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
}

.overlay{
    position:absolute;
    bottom:0;
    left:0;
    right:0;

    background:rgba(0,0,0,0.75);

    color:white;

    padding:12px;

    font-weight:bold;

    font-size:1.15vw;

    line-height:1.3;
}

.footer{
    height:40px;
    background:#000;
    display:flex;
    align-items:center;
    overflow:hidden;
}

.ticker{
    color:white;
    white-space:nowrap;
    padding-left:100%;
    animation:ticker 60s linear infinite;
    font-size:18px;
}

@keyframes ticker{
    from{
        transform:translateX(0);
