<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SRF Sport Newswall</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial, Helvetica, sans-serif;
    overflow:hidden;
}

.header{
    height:60px;
    background:#d50000;
    color:white;
    display:flex;
    align-items:center;
    padding:0 20px;
    font-size:28px;
    font-weight:bold;
}

.grid{
    height:calc(100vh - 100px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:8px;
    padding:8px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:6px;
    background:#222;
}

.image{
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

.overlay{
    position:absolute;
    bottom:0;
    left:0;
    right:0;

    background:rgba(0,0,0,0.75);

    color:white;

    padding:14px;

    font-size:1.15vw;
    font-weight:bold;
    line-height:1.3;
}

.footer{
    height:40px;
    background:#000;
    overflow:hidden;
    display:flex;
    align-items:center;
}

.ticker{
    white-space:nowrap;
    color:white;
    font-size:18px;
    padding-left:100%;
    animation:ticker 80s linear infinite;
}

@keyframes ticker{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>

<body>

<div class="header">
    SRF SPORT
</div>

<div class="grid">

    <div class="card">
        <div class="image" id="img0"></div>
        <div class="overlay" id="title0">Lade News...</div>
    </div>

    <div class="card">
        <div class="image" id="img1"></div>
        <div class="overlay" id="title1"></div>
    </div>

    <div class="card">
        <div class="image" id="img2"></div>
        <div class="overlay" id="title2"></div>
    </div>

    <div class="card">
        <div class="image" id="img3"></div>
        <div class="overlay" id="title3"></div>
    </div>

    <div class="card">
        <div class="image" id="img4"></div>
        <div class="overlay" id="title4"></div>
    </div>

    <div class="card">
        <div class="image" id="img5"></div>
        <div class="overlay" id="title5"></div>
    </div>

</div>

<div class="footer">
    <div class="ticker" id="ticker">Lade Schlagzeilen...</div>
</div>

<script>

const feedUrl =
'https://api.allorigins.win/raw?url=' +
encodeURIComponent('https://www.srf.ch/sport/bnf/rss/718');

let allNews = [];
let page = 0;

function extractImage(description){

    const match = description.match(/<img.*?src="(.*?)"/i);

    if(match){
        return match[1];
    }

    return '';
}

function updateDisplay(){

    if(allNews.length === 0){
        return;
    }

    const start = page * 6;
    let current = allNews.slice(start,start+6);

    if(current.length < 6){
        page = 0;
        current = allNews.slice(0,6);
    }

    current.forEach((item,index)=>{

        document.getElementById('title'+index).innerText =
            item.title;

        document.getElementById('img'+index).style.backgroundImage =
            item.image
            ? `url('${item.image}')`
            : 'linear-gradient(135deg,#444,#222)';

    });

    page++;

    if(page * 6 >= allNews.length){
        page = 0;
    }
}

async function loadFeed(){

    try{

        const response = await fetch(feedUrl);

        const xmlText = await response.text();

        const parser = new DOMParser();

        const xml = parser.parseFromString(
            xmlText,
            "text/xml"
        );

        const items =
            xml.querySelectorAll("item");

        allNews = [];

        items.forEach(item => {

            const title =
                item.querySelector("title")?.textContent || "";

            const description =
                item.querySelector("description")?.textContent || "";

            allNews.push({

                title:title,

                image:extractImage(description)
