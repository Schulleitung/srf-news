<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRF Sport Newswall</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    font-family:Arial,sans-serif;
    overflow:hidden;
}

.header{
    height:60px;
    background:#d50000;
    color:white;
    font-size:28px;
    font-weight:bold;
    display:flex;
    align-items:center;
    padding-left:20px;
}

.grid{
    height:calc(100vh - 100px);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(2,1fr);
    gap:8px;
    padding:8px;
}

.card{
    position:relative;
    overflow:hidden;
    border-radius:6px;
    background:#222;
}

.card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    background:rgba(0,0,0,0.75);

    color:white;

    padding:14px;

    font-weight:bold;
    font-size:1.15vw;
    line-height:1.3;
}

.footer{
    height:40px;
    background:#000;
    color:white;
    overflow:hidden;
    display:flex;
    align-items:center;
}

.ticker{
    white-space:nowrap;
    padding-left:100%;
    animation:ticker 40s linear infinite;
    font-size:20px;
}

@keyframes ticker{
    from{
        transform:translateX(0);
    }
    to{
        transform:translateX(-100%);
    }
}

</style>
</head>

<body>

<div class="header">
    SRF SPORT
</div>

<div class="grid" id="grid"></div>

<div class="footer">
    <div class="ticker" id="ticker"></div>
</div>

<script>

const demoNews = [

{
title:"Super League: FC Luzern gewinnt Spitzenspiel",
image:"https://picsum.photos/id/1011/800/500"
},

{
title:"Nati bereitet sich auf wichtige Qualifikation vor",
image:"https://picsum.photos/id/1015/800/500"
},

{
title:"Tennis: Schweizer Talent überrascht die Konkurrenz",
image:"https://picsum.photos/id/1016/800/500"
},

{
title:"Ski Alpin: Erfolgreicher Saisonstart",
image:"https://picsum.photos/id/1025/800/500"
},

{
title:"Champions League: Spektakuläre Tore am Abend",
image:"https://picsum.photos/id/1040/800/500"
},

{
title:"Leichtathletik: Schweizer Rekord verbessert",
image:"https://picsum.photos/id/1050/800/500"
},

{
title:"Weitere Sportnews folgen in Kürze",
image:"https://picsum.photos/id/1060/800/500"
},

{
title:"Grosses Interesse an Nachwuchstalenten",
image:"https://picsum.photos/id/1070/800/500"
}

];

let page = 0;

function renderNews(){

    const grid = document.getElementById('grid');

    grid.innerHTML = "";

    const start = page * 6;
    const currentItems = demoNews.slice(start,start+6);

    currentItems.forEach(item => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${item.image}">
            <div class="overlay">${item.title}</div>
        `;

        grid.appendChild(card);

    });

    page++;

    if(page * 6 >= demoNews.length){
        page = 0;
    }

}

document.getElementById("ticker").innerHTML =
demoNews.map(x => x.title).join(" ● ");

renderNews();

setInterval(renderNews,30000);

</script>

</body>
</html>
