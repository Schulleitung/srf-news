<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SRF Sport Newswall</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#111;
    color:white;
    height:100vh;
    overflow:hidden;
}

.header{
    height:70px;
    background:#d60000;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 30px;
    font-size:24px;
    font-weight:bold;
}

#clock{
    font-size:18px;
}

.grid{
    height:calc(100vh - 120px);
    padding:10px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:10px;
}

.card{
    background:#1a1a1a;
    border-radius:8px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    box-shadow:0 0 10px rgba(0,0,0,.4);
}

.image{
    height:70%;
    background-size:cover;
    background-position:center;
}

.title{
    padding:15px;
    font-size:1.5vw;
    line-height:1.35;
    font-weight:bold;

    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.footer{
    height:50px;
    background:black;
    overflow:hidden;
    white-space:nowrap;
    display:flex;
    align-items:center;
}

.ticker{
    display:inline-block;
    padding-left:100%;
    animation:ticker 90s linear infinite;
    font-size:20px;
}

@keyframes ticker{
    from {transform:translateX(0);}
    to {transform:translateX(-100%);}
}

</style>
</head>

<body>

<div class="header">
    <div>SRF SPORT</div>
    <div id="clock"></div>
</div>

<div class="grid">

    <div class="card">
        <div class="image" id="img0"></div>
        <div class="title" id="title0">Lade News...</div>
    </div>

    <div class="card">
        <div class="image" id="img1"></div>
        <div class="title" id="title1"></div>
    </div>

    <div class="card">
        <div class="image" id="img2"></div>
        <div class="title" id="title2"></div>
    </div>

    <div class="card">
        <div class="image" id="img3"></div>
        <div class="title" id="title3"></div>
    </div>

</div>

<div class="footer">
    <div class="ticker" id="ticker"></div>
</div>

<script>

const feedUrl =
'https://api.rss2json.com/v1/api.json?rss_url=https://www.srf.ch/sport/bnf/rss/718';

async function loadNews(){

    try{

        const response = await fetch(feedUrl);
        const data = await response.json();

        const items = data.items.slice(0,4);

        items.forEach((item,index)=>{

            document.getElementById('title'+index).innerText =
                item.title;

            if(item.thumbnail){
                document.getElementById('img'+index)
                    .style.backgroundImage =
                    `url('${item.thumbnail}')`;
            }

        });

        document.getElementById("ticker").innerHTML =
            data.items.map(x=>"⚽ "+x.title).join(" &nbsp;&nbsp;&nbsp; ● &nbsp;&nbsp;&nbsp; ");

    }
    catch(error){
        console.log(error);
    }
}

function updateClock(){

    document.getElementById("clock").innerText =
        new Date().toLocaleTimeString(
            "de-CH",
            {
                hour:"2-digit",
                minute:"2-digit"
            }
        );
}

setInterval(updateClock,1000);
setInterval(loadNews,300000);

updateClock();
loadNews();

</script>

</body>
</html>
