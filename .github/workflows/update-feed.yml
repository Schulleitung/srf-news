name: Update SRF Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download RSS feed
        run: |
          curl -L "https://www.srf.ch/sport/bnf/rss/718" -o feed.xml

      - name: Create JSON
        run: |
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import json
          import re

          tree = ET.parse("feed.xml")
          root = tree.getroot()

          news = []

          for item in root.findall(".//item"):
              title = item.findtext("title", "")

              description = item.findtext("description", "")

              image = ""

              m = re.search(r'src="([^"]+)"', description)

              if m:
                  image = m.group(1)

              news.append({
                  "title": title,
                  "image": image
              })

          with open("news.json","w",encoding="utf-8") as f:
              json.dump(news,f,ensure_ascii=False,indent=2)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add news.json

          git diff --cached --quiet || git commit -m "Update SRF news"

          git push
